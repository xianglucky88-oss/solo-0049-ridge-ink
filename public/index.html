<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>岭线排图</title><link rel="stylesheet" href="/style.css"><script type="module" src="/js/main.mjs"></script></head>
<body><header><h1>岭线排图</h1><p>高程格网制图、相邻分幅与测线剖面</p></header>
<main><section class="print"><div class="printbar"><h2 id="sheet-heading">图幅</h2><div class="print-actions"><button id="export-all" disabled>下载整组 SVG</button><button id="export" disabled>补导当前图幅 SVG</button></div></div>
<div id="sheet-tabs" class="tabs" role="tablist" aria-label="切换图幅" hidden></div>
<p id="confirmed-note" class="confirmed-note" hidden></p>
<div class="map"><img id="sheet" alt="当前图幅的地形等高线" hidden></div>
<div class="cut"><h2>测线剖面</h2><p id="profile-note"></p><canvas id="profile" width="610" height="145" aria-label="高程剖面图"></canvas></div></section>
<aside><h2>制图参数</h2><form><div class="tools"><button id="demo" type="button">读取示例</button><label>导入格网<input id="file" type="file" accept=".json"></label></div>
<label>格网 JSON<textarea name="grid" rows="3" spellcheck="false"></textarea></label>
<div class="pair"><label>等高距 / 米<input name="interval" type="number" value="20" step="any"></label><label>参考高程 / 米<input name="offset" type="number" value="0" step="any"></label></div>
<label class="toggle"><input type="checkbox" name="group" checked>分幅组出图（多张相邻矩形图幅）</label>
<fieldset id="group-fields"><legend>图幅组 / JSON 数组</legend>
<textarea name="sheets" rows="7" spellcheck="false">[{"id":"west","left":0,"bottom":0,"right":300,"top":420},{"id":"ne","left":300,"bottom":210,"right":540,"top":420},{"id":"se","left":300,"bottom":0,"right":540,"top":210}]</textarea>
<div class="group-tools"><button type="button" id="make-t">按当前格网生成 T 形三分幅</button><span class="hint">元素可写 {"id","name","left","bottom","right","top"} 或 [左,南,东,北]；内部不得重叠。</span></div>
</fieldset>
<label class="toggle"><input type="checkbox" name="crop">限定单幅边界（不使用分幅组时生效）</label>
<fieldset id="crop-fields" hidden><legend>图幅边界 / 米</legend><div class="pair"><label>西<input type="number" name="left" value="40" step="any"></label><label>东<input type="number" name="right" value="450" step="any"></label><label>南<input type="number" name="bottom" value="40" step="any"></label><label>北<input type="number" name="top" value="370" step="any"></label></div></fieldset>
<label class="toggle"><input type="checkbox" name="measure">自定义测线</label>
<fieldset id="section-fields" hidden><legend>测线端点 / 米</legend><div class="pair"><label>起点东<input name="x1" type="number" value="0" step="any"></label><label>起点北<input name="y1" type="number" value="130" step="any"></label><label>终点东<input name="x2" type="number" value="540" step="any"></label><label>终点北<input name="y2" type="number" value="130" step="any"></label></div><label>测点数<input type="number" name="count" value="61"></label></fieldset>
<button class="primary">更新图幅</button><p id="status" role="status"></p></form>
<section class="legend"><h2>高程分层</h2><ul id="levels"></ul></section></aside></main></body></html>
